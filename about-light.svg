<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient>
<style>
.fade{opacity:0;animation:fade .8s ease-out forwards}
.slide{opacity:0;transform:translateY(14px);animation:slide .8s ease-out forwards}
@keyframes fade{to{opacity:1}}
@keyframes slide{to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

</style></defs>
<rect width="900" height="250" rx="16" fill="url(#bg)" stroke="#d0d7de"/>
<rect x="40" y="36" width="5" height="28" rx="2.5" fill="url(#ac)"/>
<text x="58" y="58" font-size="26" font-weight="800" fill="#1f2328">About</text>
